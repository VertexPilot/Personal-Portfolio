<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Pasindu Lakshan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="neon.css">
</head>
<body>

<header>
    <div class="logo"> 
        <img src="images/logo.png" alt="OGAA Logo">
    </div>
    <nav>
        <a href="index.html#home">Home</a>
        <a href="index.html#about">About me</a>
        <a href="index.html#journey">Education</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#contact">Contact me</a>
    </nav>
    <button class="hire-nav" type="button" onclick="window.location.href='index.html#contact'">Get In Touch</button>
</header>

<section class="contact-container">
    <div class="contact-box">
        <div class="contact-form">
            <h2>Send me a <span>Message</span></h2>
            <form id="legacy-contact-form">
                <input
                    type="hidden"
                    name="access_key"
                    value="3a7ec319-418d-4992-bf59-163470f2b099">
                <input id="legacy-sender-name" type="text" name="name" placeholder="Your Name" required>
                <input id="legacy-sender-email" type="email" name="email" placeholder="Your Email" required>
                <textarea id="legacy-sender-message" name="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="hire-btn1">Send Message</button>
            </form>
        <p id="legacy-form-note" style="color:#9aa4c0;font-size:12px;margin-top:10px;">Your message will be sent securely through the contact form.</p>
        </div>

        <div class="contact-info">
            <h2>Contact <span>Information</span></h2>
            <p>I am currently open for internships and freelance projects. Let's connect!</p>
            
            <div class="social-icons-grid">
                <a href="mailto:lakshanpasindu0908@gmail.com" class="icon-link">
                    <img src="images/gmail.png" alt="Gmail">
                </a>
                <a href="https://www.linkedin.com/in/pasindu-lakshan-jayasinghe/" target="_blank" rel="noopener noreferrer" class="icon-link">
                    <img src="images/linkdln.png" alt="LinkedIn">
                </a>
                <a href="https://github.com/VertexPilot" class="icon-link">
                    <img src="images/github.png" alt="GitHub">
                </a>
                <a href="https://www.facebook.com/lakshan.pasindu.1293" class="icon-link">
                    <img src="images/FB.png" alt="Facebook">
                </a>
                <a href="https://www.instagram.com/____pasindu_lakshan____/" class="icon-link">
                    <img src="images/insta.png" alt="Instagram">
                </a>
                <a href="https://x.com/Pasindu_L4kshan" class="icon-link">
                    <img src="images/twitter.png" alt="Twitter">
                </a>
            </div>
            
            <div class="location-tag">
                <p>📍 Kurunegala, Sri Lanka</p>
            </div>
        </div>
    </div>
</section>

<script>
    (() => {
        const form = document.getElementById("legacy-contact-form");
        const note = document.getElementById("legacy-form-note");

        if (!form) return;

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!form.reportValidity()) return;

            const button = form.querySelector('button[type="submit"]');
            if (!button) return;

            const originalText = button.textContent;

            button.disabled = true;
            button.textContent = "Sending...";

            if (note) note.textContent = "Sending your message...";

            try {
                const response = await fetch(
                    "https://api.web3forms.com/submit",
                    {
                        method: "POST",
                        body: new FormData(form)
                    }
                );

                const result = await response.json();

                if (!response.ok || result.success !== true) {
                    throw new Error(
                        result.message || "Message could not be sent."
                    );
                }

                if (note) {
                    note.textContent =
                        "Message sent successfully! Thank you for reaching out.";
                }

                form.reset();

            } catch (error) {
                console.error("Contact form error:", error);

                if (note) {
                    note.textContent =
                        "Unable to send your message. Please try again later.";
                }

            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        });
    })();
</script>
</body>
</html>
